<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="422" viewBox="0 0 1000 422" role="img" aria-label="BrainBase: Enterprise Knowledge AI Assistant"><title>BrainBase: Enterprise Knowledge AI Assistant</title><style>@font-face{font-family:I;font-weight:600;font-style:normal;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:F;font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:I;font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:I;font-weight:500;font-style:normal;src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="422" rx="14" fill="#F2ECE1"/><text x="56.0" y="62.0" font-family="I" font-weight="600" font-style="normal" font-size="12" fill="#E5262A" letter-spacing="1.2" text-anchor="start" >01   OCT TO NOV 2026</text><text x="56.0" y="102.0" font-family="F" font-weight="400" font-style="normal" font-size="28" fill="#1B2430" letter-spacing="0" text-anchor="start" >BrainBase</text><text x="56.0" y="138.0" font-family="I" font-weight="400" font-style="normal" font-size="15" fill="#6B7686" letter-spacing="0" text-anchor="start" >Enterprise Knowledge AI Assistant</text><text x="56.0" y="180.0" font-family="I" font-weight="500" font-style="normal" font-size="14" fill="#E5262A" letter-spacing="0" text-anchor="start" >View repository →</text><rect x="56" y="187" width="116.6" height="1" fill="#E5262A"/><text x="380.0" y="62.0" font-family="I" font-weight="400" font-style="normal" font-size="16" fill="#1B2430" letter-spacing="0" text-anchor="start" >–</text><text x="402.0" y="62.0" font-family="I" font-weight="400" font-style="normal" font-size="16" fill="#46515F" letter-spacing="0" text-anchor="start" >RAG assistant with role-based access control that answers with</text><text x="402.0" y="88.0" font-family="I" font-weight="400" font-style="normal" font-size="16" fill="#46515F" letter-spacing="0" text-anchor="start" >citations across the handbook, Slack, GitLab issues and wikis, and</text><text x="402.0" y="114.0" font-family="I" font-weight="400" font-style="normal" font-size="16" fill="#46515F" letter-spacing="0" text-anchor="start" >uploaded documents, using hybrid semantic + keyword search.</text><text x="380.0" y="150.0" font-family="I" font-weight="400" font-style="normal" font-size="16" fill="#1B2430" letter-spacing="0" text-anchor="start" >–</text><text x="402.0" y="150.0" font-family="I" font-weight="400" font-style="normal" font-size="16" fill="#46515F" letter-spacing="0" text-anchor="start" >LangGraph orchestration routes each message to chat, knowledge</text><text x="402.0" y="176.0" font-family="I" font-weight="400" font-style="normal" font-size="16" fill="#46515F" letter-spacing="0" text-anchor="start" >lookup, action or clarification, and rewrites follow-ups to stand alone.</text><text x="380.0" y="212.0" font-family="I" font-weight="400" font-style="normal" font-size="16" fill="#1B2430" letter-spacing="0" text-anchor="start" >–</text><text x="402.0" y="212.0" font-family="I" font-weight="400" font-style="normal" font-size="16" fill="#46515F" letter-spacing="0" text-anchor="start" >An evidence verification step checks that sources support an answer</text><text x="402.0" y="238.0" font-family="I" font-weight="400" font-style="normal" font-size="16" fill="#46515F" letter-spacing="0" text-anchor="start" >before generating one; confirmed actions like GitLab issues or Slack</text><text x="402.0" y="264.0" font-family="I" font-weight="400" font-style="normal" font-size="16" fill="#46515F" letter-spacing="0" text-anchor="start" >posts run via MCP with audit logging.</text><rect x="380.0" y="304" width="69.7" height="30" rx="15" fill="none" stroke="#C9BFAE"/><text x="414.9" y="323.5" font-family="I" font-weight="500" font-style="normal" font-size="13" fill="#1B2430" letter-spacing="0" text-anchor="middle" >Python</text><rect x="457.7" y="304" width="73.6" height="30" rx="15" fill="none" stroke="#C9BFAE"/><text x="494.5" y="323.5" font-family="I" font-weight="500" font-style="normal" font-size="13" fill="#1B2430" letter-spacing="0" text-anchor="middle" >FastAPI</text><rect x="539.3" y="304" width="94.6" height="30" rx="15" fill="none" stroke="#C9BFAE"/><text x="586.6" y="323.5" font-family="I" font-weight="500" font-style="normal" font-size="13" fill="#1B2430" letter-spacing="0" text-anchor="middle" >LangGraph</text><rect x="641.9" y="304" width="100.1" height="30" rx="15" fill="none" stroke="#C9BFAE"/><text x="691.9" y="323.5" font-family="I" font-weight="500" font-style="normal" font-size="13" fill="#1B2430" letter-spacing="0" text-anchor="middle" >PostgreSQL</text><rect x="750.0" y="304" width="69.4" height="30" rx="15" fill="none" stroke="#C9BFAE"/><text x="784.7" y="323.5" font-family="I" font-weight="500" font-style="normal" font-size="13" fill="#1B2430" letter-spacing="0" text-anchor="middle" >Next.js</text><rect x="827.3" y="304" width="94.3" height="30" rx="15" fill="none" stroke="#C9BFAE"/><text x="874.5" y="323.5" font-family="I" font-weight="500" font-style="normal" font-size="13" fill="#1B2430" letter-spacing="0" text-anchor="middle" >TypeScript</text><rect x="380.0" y="344" width="72.2" height="30" rx="15" fill="none" stroke="#C9BFAE"/><text x="416.1" y="363.5" font-family="I" font-weight="500" font-style="normal" font-size="13" fill="#1B2430" letter-spacing="0" text-anchor="middle" >OpenAI</text><rect x="460.2" y="344" width="55.7" height="30" rx="15" fill="none" stroke="#C9BFAE"/><text x="488.1" y="363.5" font-family="I" font-weight="500" font-style="normal" font-size="13" fill="#1B2430" letter-spacing="0" text-anchor="middle" >MCP</text><rect x="524.0" y="344" width="84.0" height="30" rx="15" fill="none" stroke="#C9BFAE"/><text x="566.0" y="363.5" font-family="I" font-weight="500" font-style="normal" font-size="13" fill="#1B2430" letter-spacing="0" text-anchor="middle" >Langfuse</text><rect x="616.0" y=