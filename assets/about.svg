<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="594" viewBox="0 0 1000 594" role="img" aria-label="About: AI engineer building agentic RAG pipelines and multi-agent systems. 2.5+ years, 30 markets served, 40K rows per ETL job, 4 AI products shipped."><title>About: AI engineer building agentic RAG pipelines and multi-agent systems. 2.5+ years, 30 markets served, 40K rows per ETL job, 4 AI products shipped.</title><style>@font-face{font-family:I;font-weight:600;font-style:normal;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:F;font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:I;font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:I;font-weight:500;font-style:normal;src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="594" rx="14" fill="#F2ECE1"/><text x="56.0" y="60.0" font-family="I" font-weight="600" font-style="normal" font-size="13" fill="#E5262A" letter-spacing="1.5" text-anchor="start" >01</text><text x="56.0" y="104.0" font-family="F" font-weight="400" font-style="normal" font-size="40" fill="#1B2430" letter-spacing="0" text-anchor="start" >About</text><rect x="56" y="130" width="888" height="1" fill="#D9CFBE"/><text x="56.0" y="174.0" font-family="I" font-weight="400" font-style="normal" font-size="17" fill="#46515F" letter-spacing="0" text-anchor="start" >I build agentic RAG pipelines, multi-agent systems and the cloud-native platforms around them, from the first</text><text x="56.0" y="202.0" font-family="I" font-weight="400" font-style="normal" font-size="17" fill="#46515F" letter-spacing="0" text-anchor="start" >prototype to something enterprise teams rely on.</text><text x="56.0" y="244.0" font-family="I" font-weight="400" font-style="normal" font-size="17" fill="#46515F" letter-spacing="0" text-anchor="start" >Over 2.5 years I've worked across Python, LangChain, pgvector, Next.js and Node.js, with end-to-end</text><text x="56.0" y="272.0" font-family="I" font-weight="400" font-style="normal" font-size="17" fill="#46515F" letter-spacing="0" text-anchor="start" >ownership of systems used by enterprise clients and partners across 30 markets.</text><text x="56.0" y="314.0" font-family="I" font-weight="400" font-style="normal" font-size="17" fill="#46515F" letter-spacing="0" text-anchor="start" >I care about the parts that make a model trustworthy once real people depend on it: evaluation, evidence</text><text x="56.0" y="342.0" font-family="I" font-weight="400" font-style="normal" font-size="17" fill="#46515F" letter-spacing="0" text-anchor="start" >verification, access control and observability.</text><rect x="56.0" y="384" width="104.8" height="30" rx="15" fill="none" stroke="#C9BFAE"/><text x="108.4" y="403.5" font-family="I" font-weight="500" font-style="normal" font-size="13" fill="#1B2430" letter-spacing="0" text-anchor="middle" >Agentic RAG</text><rect x="168.8" y="384" width="184.5" height="30" rx="15" fill="none" stroke="#C9BFAE"/><text x="261.0" y="403.5" font-family="I" font-weight="500" font-style="normal" font-size="13" fill="#1B2430" letter-spacing="0" text-anchor="middle" >Multi-agent orchestration</text><rect x="361.3" y="384" width="172.7" height="30" rx="15" fill="none" stroke="#C9BFAE"/><text x="447.6" y="403.5" font-family="I" font-weight="500" font-style="normal" font-size="13" fill="#1B2430" letter-spacing="0" text-anchor="middle" >Model Context Protocol</text><rect x="541.9" y="384" width="194.2" height="30" rx="15" fill="none" stroke="#C9BFAE"/><text x="639.0" y="403.5" font-family="I" font-weight="500" font-style="normal" font-size="13" fill="#1B2430" letter-spacing="0" text-anchor="middle" >AWS cloud-native systems</text><rect x="56" y="454" width="888" height="1" fill="#D9CFBE"/><text x="56.0" y="524.0" font-family="F" font-weight="400" font-style="normal" font-size="52" fill="#1B2430" letter-spacing="-1" text-anc