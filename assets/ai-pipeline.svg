<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340" font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f0c29"/>
      <stop offset="1" stop-color="#1b1640"/>
    </linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#231d4f"/>
      <stop offset="1" stop-color="#16123a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7f5af0"/>
      <stop offset="1" stop-color="#2cb67d"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .flow { stroke: #7f5af0; stroke-width: 2; stroke-dasharray: 6 8; fill: none; animation: dash 1.2s linear infinite; }
      @keyframes dash { to { stroke-dashoffset: -28; } }
      .ring { fill: none; stroke: #7f5af0; stroke-width: 2; opacity: 0.25; animation: pulse 5s ease-in-out infinite; }
      .r2 { animation-delay: 1s; } .r3 { animation-delay: 2s; } .r4 { animation-delay: 3s; } .r5 { animation-delay: 4s; }
      @keyframes pulse { 0%,100% { opacity: 0.25; } 10% { opacity: 1; } 25% { opacity: 0.25; } }
      .title { fill: #ffffff; font-size: 15px; font-weight: 700; }
      .sub { fill: #a9a3d6; font-size: 11.5px; }
      .step { fill: #7f5af0; font-size: 10.5px; font-weight: 700; letter-spacing: 1.5px; font-family: 'JetBrains Mono', Consolas, monospace; }
      .head { fill: #ffffff; font-size: 20px; font-weight: 700; }
      .tag { fill: #c3b8ff; font-size: 12px; font-family: 'JetBrains Mono', Consolas, monospace; }
      .foot { fill: #a9a3d6; font-size: 12.5px; }
      .blink { animation: blink 1s steps(2) infinite; }
      @keyframes blink { to { opacity: 0; } }
    </style>
  </defs>

  <rect width="960" height="340" rx="16" fill="url(#bg)"/>
  <rect width="960" height="340" rx="16" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="959" height="339" rx="16" fill="none" stroke="#7f5af0" stroke-opacity="0.35"/>

  <!-- Header -->
  <text x="40" y="52" class="tag">$ how_i_build --system production-rag<tspan class="blink" fill="#7f5af0"> ▌</tspan></text>
  <text x="40" y="84" class="head">From scattered company knowledge to grounded, cited answers</text>

  <!-- Connectors -->
  <path class="flow" d="M196 196 H222"/>
  <path class="flow" d="M376 196 H402"/>
  <path class="flow" d="M556 196 H582"/>
  <path class="flow" d="M736 196 H762"/>

  <!-- Travelling packet -->
  <circle r="5" fill="#2cb67d" filter="url(#glow)">
    <animateMotion dur="5s" repeatCount="indefinite" path="M118 196 H838"/>
    <animate attributeName="opacity" values="0;1;1;1;0" dur="5s" repeatCount="indefinite"/>
  </circle>

  <!-- Node 1 -->
  <g transform="translate(40,128)">
    <rect width="156" height="136" rx="12" fill="url(#node)" stroke="#3a3270"/>
    <rect class="ring" width="156" height="136" rx="12"/>
    <text x="16" y="28" class="step">01 · SOURCES</text>
    <text x="16" y="62" class="title">Connect data</text>
    <text x="16" y="86" class="sub">Slack · GitLab</text>
    <text x="16" y="104" class="sub">uploaded</text>
    <text x="16" y="122" class="sub">documents</text>
  </g>

  <!-- Node 2 -->
  <g transform="translate(222,128)">
    <rect width="154" height="136" rx="12" fill="url(#node)" stroke="#3a3270"/>
    <rect class="ring r2" width="154" height="136" rx="12"/>
    <text x="16" y="28" class="step">02 · INDEX</text>
    <text x="16" y="62" class="title">Chunk + embed</text>
    <text x="16" y="86" class="sub">PostgreSQL</text>
    <text x="16" y="104" class="sub">+ pgvector</text>
    <text x="16" y="122" class="sub">metadata + ACLs</text>
  </g>

  <!-- Node 3 -->
  <g transform="translate(402,128)">
    <rect width="154" height="136" rx="12" fill="url(#node)" stroke="#3a3270"/>
    <rect class="ring r3" width="154" height="136" rx="12"/>
    <text x="16" y="28" class="step">03 · RETRIEVE</text>
    <text x="16" y="62" class="title">Secure search</text>
    <text x="16" y="86" class="sub">access rules run</text>
    <text x="16" y="104" class="sub">inside the query</text>
    <text x="16" y="122" class="sub">semantic + filters</text>
  </g>

  <!-- Node 4 -->
  <g transform="translate(582,128)">
    <rect width="154" height="136" rx="12" fill="url(#node)" stroke="#3a3270"/>
    <rect class="ring r4" width="154" height="136" rx="12"/>
    <text x="16" y="28" class="step">04 · VERIFY</text>
    <text x="16" y="62" class="title">Check grounding</text>
    <text x="16" y="86" class="sub">do sources really</text>
    <text x="16" y="104" class="sub">support the answer?</text>
    <text x="16" y="122" class="sub">LangGraph agent</text>
  </g>

  <!-- Node 5 -->
  <g transform="translate(762,128)">
    <rect width="158" height="136" rx="12" fill="url(#node)" stroke="#2cb67d" stroke-opacity="0.6"/>
    <rect class="ring r5" width="158" height="136" rx="12" style="stroke:#2cb67d"/>
    <text x="16" y="28" class="step" fill="#2cb67d" style="fill:#2cb67d">05 · ACT</text>
    <text x="16" y="62" class="title">Cited answer</text>
    <text x="16" y="86" class="sub">every claim linked</text>
    <text x="16" y="104" class="sub">to its source</text>
    <text x="16" y="122" class="sub">+ MCP actions ✓</text>
  </g>

  <!-- Footer -->
  <rect x="40" y="290" width="880" height="1" fill="url(#accent)" opacity="0.5"/>
  <text x="40" y="316" class="foot"><tspan fill="#7f5af0">◆</tspan> Orchestrated with LangGraph<tspan dx="18" fill="#7f5af0">◆</tspan> Traced in Langfuse<tspan dx="18" fill="#2cb67d">◆</tspan> Prompts versioned + eval-gated with PromptDock</text>
</svg>
